name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,ui,dev]"
      - name: Test
        run: pytest -q -m "not slow"

  integration:
    # Starts real subprocesses on real ports: the plant, PLC, historian and HMI
    # talking Modbus, OPC UA and HTTP to each other.
    name: integration tests
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,ui,dev]"
      - name: Test
        run: pytest -q -m slow

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t pyplant:ci .
      - name: Smoke test
        run: |
          docker run -d --name pyplant -p 8050:8050 pyplant:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8050/ > /dev/null && echo "workbench is up" && exit 0
            sleep 2
          done
          docker logs pyplant
          exit 1

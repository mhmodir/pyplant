<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pyplant HMI</title>
<style>
  :root {
    --bg:#101418; --panel:#181d23; --line:#2a323b; --text:#dfe6ee; --dim:#8b97a4;
    --ok:#3fa46a; --low:#4a90d9; --med:#d8a13a; --high:#e0702c; --crit:#d1444b;
    --accent:#5aa9e6;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:14px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 18px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.3px; }
  .pill { padding:2px 9px; border-radius:11px; font-size:12px;
          border:1px solid var(--line); color:var(--dim); }
  .pill.on { color:var(--ok); border-color:var(--ok); }
  .pill.bad { color:var(--crit); border-color:var(--crit); }
  main { display:grid; grid-template-columns:minmax(420px,1fr) minmax(360px,1fr);
         gap:14px; padding:14px; align-items:start; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:12px 14px; }
  .panel h2 { margin:0 0 10px; font-size:12px; letter-spacing:.09em;
              text-transform:uppercase; color:var(--dim); font-weight:600; }
  svg { width:100%; height:auto; display:block; }
  .vessel { fill:none; stroke:var(--line); stroke-width:2; }
  .liquid { fill:var(--low); opacity:.55; }
  .pipe { stroke:var(--line); stroke-width:3; fill:none; }
  .flow { stroke:var(--accent); stroke-width:3; fill:none; }
  .label { fill:var(--dim); font-size:10px; }
  .value { fill:var(--text); font-size:12px; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:11px; text-transform:uppercase;
       letter-spacing:.07em; color:var(--dim); font-weight:600;
       border-bottom:1px solid var(--line); padding:5px 6px; }
  td { padding:6px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.p4 td:first-child { border-left:3px solid var(--crit); }
  tr.p3 td:first-child { border-left:3px solid var(--high); }
  tr.p2 td:first-child { border-left:3px solid var(--med); }
  tr.p1 td:first-child { border-left:3px solid var(--low); }
  .state { font-size:11px; padding:1px 7px; border-radius:9px;
           border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .state.UNACK_ALARM { color:var(--crit); border-color:var(--crit); }
  .state.RTN_UNACK { color:var(--med); border-color:var(--med); }
  .state.ACK_ALARM { color:var(--high); border-color:var(--high); }
  .state.SHELVED { color:var(--dim); }
  .blink { animation:pulse 1s steps(2,end) infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  button, input, select { background:#212932; color:var(--text);
    border:1px solid var(--line); border-radius:5px; padding:5px 9px;
    font:inherit; font-size:13px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.small { padding:2px 7px; font-size:12px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
         margin-bottom:9px; }
  .row label { color:var(--dim); min-width:76px; font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr));
          gap:8px; }
  .kv { border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .kv .k { color:var(--dim); font-size:11px; }
  .kv .v { font-size:16px; font-weight:600; }
  .kv .u { color:var(--dim); font-size:11px; font-weight:400; }
  .muted { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>pyplant &mdash; Unit 1</h1>
  <span class="pill" id="link">connecting</span>
  <span class="pill" id="alarmpill">alarms 0</span>
  <span class="pill" id="mode">&mdash;</span>
  <span class="muted" id="stamp"></span>
</header>

<main>
  <section class="panel">
    <h2>Mimic</h2>
    <svg viewBox="0 0 460 300" role="img" aria-label="Two tank process mimic">
      <!-- pump -->
      <circle cx="42" cy="196" r="17" class="vessel" id="pumpBody"/>
      <text x="42" y="200" text-anchor="middle" class="value">P</text>
      <text x="42" y="230" text-anchor="middle" class="label">PMP101</text>
      <path class="pipe" d="M59 196 H104"/>
      <path class="flow" id="pipeIn" d="M59 196 H104" stroke-dasharray="6 6"/>

      <!-- control valve -->
      <path d="M104 186 l0 20 22 -20 0 20 z" class="vessel" id="valveBody"/>
      <text x="115" y="230" text-anchor="middle" class="label">FCV101</text>
      <path class="pipe" d="M126 196 H164 V96"/>

      <!-- tank 1 -->
      <rect x="164" y="46" width="92" height="150" class="vessel" rx="3"/>
      <rect id="liq1" x="166" y="146" width="88" height="48" class="liquid"/>
      <text x="210" y="38" text-anchor="middle" class="label">TANK 1</text>
      <text id="lt101" x="210" y="120" text-anchor="middle" class="value">--</text>
      <text x="210" y="134" text-anchor="middle" class="label">LT101 mm</text>

      <!-- interconnect -->
      <path class="pipe" d="M256 190 H300 V116"/>

      <!-- tank 2 -->
      <rect x="300" y="66" width="92" height="130" class="vessel" rx="3"/>
      <rect id="liq2" x="302" y="166" width="88" height="28" class="liquid"/>
      <text x="346" y="58" text-anchor="middle" class="label">TANK 2</text>
      <text id="lt102" x="346" y="132" text-anchor="middle" class="value">--</text>
      <text x="346" y="146" text-anchor="middle" class="label">LT102 mm</text>

      <!-- drain -->
      <path class="pipe" d="M392 190 H430 V250"/>
      <text x="430" y="266" text-anchor="middle" class="label">FT102</text>
    </svg>

    <div class="grid" style="margin-top:10px">
      <div class="kv"><div class="k">FT101</div>
        <div class="v"><span id="ft101">--</span> <span class="u">L/min</span></div></div>
      <div class="kv"><div class="k">PT101</div>
        <div class="v"><span id="pt101">--</span> <span class="u">kPa</span></div></div>
      <div class="kv"><div class="k">ZT101</div>
        <div class="v"><span id="zt101">--</span> <span class="u">%</span></div></div>
      <div class="kv"><div class="k">Scan</div>
        <div class="v"><span id="scan">--</span> <span class="u">ms</span></div></div>
    </div>
  </section>

  <section class="panel">
    <h2>LIC101</h2>
    <div class="grid" style="margin-bottom:10px">
      <div class="kv"><div class="k">PV</div>
        <div class="v"><span id="pv">--</span> <span class="u">mm</span></div></div>
      <div class="kv"><div class="k">SP</div>
        <div class="v"><span id="sp">--</span> <span class="u">mm</span></div></div>
      <div class="kv"><div class="k">OP</div>
        <div class="v"><span id="op">--</span> <span class="u">%</span></div></div>
      <div class="kv"><div class="k">Error</div>
        <div class="v"><span id="err">--</span> <span class="u">mm</span></div></div>
    </div>
    <div class="row">
      <label for="spIn">Setpoint</label>
      <input id="spIn" type="number" step="1" min="0" max="600" style="width:96px">
      <button onclick="post('/api/setpoint',{value:+spIn.value})">Write</button>
    </div>
    <div class="row">
      <label for="manIn">Manual OP</label>
      <input id="manIn" type="number" step="1" min="0" max="100" style="width:96px">
      <button onclick="post('/api/manual',{value:+manIn.value})">Write</button>
    </div>
    <div class="row">
      <label>Mode</label>
      <button onclick="post('/api/mode',{auto:true})">Auto</button>
      <button onclick="post('/api/mode',{auto:false})">Manual</button>
      <label style="margin-left:10px">Pump</label>
      <button onclick="post('/api/pump',{start:true})">Start</button>
      <button onclick="post('/api/pump',{start:false})">Stop</button>
      <button onclick="post('/api/reset',{})">Reset</button>
    </div>
    <p class="muted" id="msg"></p>
  </section>

  <section class="panel" style="grid-column:1/-1">
    <h2>Trend</h2>
    <div class="row">
      <label for="span">Window</label>
      <select id="span" onchange="refreshTrend()">
        <option value="120">2 min</option>
        <option value="300" selected>5 min</option>
        <option value="900">15 min</option>
        <option value="3600">1 hour</option>
      </select>
      <span class="muted" id="legend"></span>
    </div>
    <svg id="trend" viewBox="0 0 900 240" preserveAspectRatio="none"></svg>
  </section>

  <section class="panel" style="grid-column:1/-1">
    <h2>Alarms</h2>
    <div class="row">
      <button onclick="post('/api/alarms/ack',{tag:null})">Acknowledge all</button>
    </div>
    <table>
      <thead><tr><th>Priority</th><th>Tag</th><th>Message</th><th>State</th>
      <th>In</th><th>Count</th><th></th></tr></thead>
      <tbody id="alarmBody">
        <tr><td colspan="7" class="muted">No active alarms.</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const COLORS = ["#5aa9e6", "#d8a13a", "#3fa46a", "#d1444b", "#a78bfa"];
let editing = false;
["spIn","manIn"].forEach(id => {
  $(id).addEventListener("focus", () => editing = true);
  $(id).addEventListener("blur", () => editing = false);
});

function fmt(v, dp = 1) {
  return (v === null || v === undefined) ? "--" : Number(v).toFixed(dp);
}

async function post(url, body) {
  try {
    const r = await fetch(url, {method: "POST",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const data = await r.json();
    $("msg").textContent = r.ok ? "" : (data.detail || "write rejected");
    if (r.ok) refresh();
  } catch (e) { $("msg").textContent = String(e); }
}

function level(id, mm, top, height) {
  // Tanks span 0..600 mm over the rectangle's height.
  const frac = Math.max(0, Math.min(1, (mm || 0) / 600));
  const h = height * frac;
  const el = $(id);
  el.setAttribute("y", top + height - h);
  el.setAttribute("height", Math.max(h, 0));
}

async function refresh() {
  let s;
  try { s = await (await fetch("/api/state")).json(); }
  catch (e) { $("link").textContent = "offline"; $("link").className = "pill bad"; return; }

  const v = s.values || {};
  $("link").textContent = s.connected ? "connected" : "link down";
  $("link").className = "pill " + (s.connected ? "on" : "bad");
  $("stamp").textContent = s.updated ? s.updated.replace("T", " ").slice(0, 19) : "";
  $("mode").textContent = v.LIC101_AUTO ? "AUTO" : "MANUAL";
  $("mode").className = "pill " + (v.LIC101_AUTO ? "on" : "");

  $("lt101").textContent = fmt(v.LT101);
  $("lt102").textContent = fmt(v.LT102);
  $("ft101").textContent = fmt(v.FT101, 2);
  $("pt101").textContent = fmt(v.PT101, 1);
  $("zt101").textContent = fmt(v.ZT101, 1);
  $("scan").textContent = fmt(v.SCAN_MS, 1);
  $("pv").textContent = fmt(v.LIC101_PV);
  $("sp").textContent = fmt(v.LIC101_SP);
  $("op").textContent = fmt(v.LIC101_OP);
  $("err").textContent = fmt(v.LIC101_ERR);
  if (!editing) {
    $("spIn").value = fmt(v.LIC101_SP, 0);
    $("manIn").value = fmt(v.LIC101_MAN_OP, 0);
  }

  level("liq1", v.LT101, 46, 150);
  level("liq2", v.LT102, 66, 130);
  $("pumpBody").style.stroke = v.PMP101_RUN ? "var(--ok)" : "var(--line)";
  $("pipeIn").style.opacity = v.PMP101_RUN ? 1 : 0.15;
  $("valveBody").style.stroke = (v.ZT101 > 1) ? "var(--accent)" : "var(--line)";

  const sum = s.summary || {counts: {}};
  $("alarmpill").textContent = "alarms " + (sum.unacknowledged || 0);
  $("alarmpill").className = "pill " + (sum.unacknowledged ? "bad blink" : "");

  const rows = (s.alarms || []).map(a => `
    <tr class="p${a.priority}">
      <td>${a.priority_name}</td>
      <td>${a.tag}</td>
      <td>${a.message}</td>
      <td><span class="state ${a.state}">${a.state.replace(/_/g, " ")}</span></td>
      <td class="muted">${a.in_time ? a.in_time.slice(11, 19) : ""}</td>
      <td>${a.count}</td>
      <td>
        <button class="small" onclick='post("/api/alarms/ack",{tag:"${a.tag}"})'>Ack</button>
        ${a.state === "SHELVED"
          ? `<button class="small" onclick='post("/api/alarms/unshelve",{tag:"${a.tag}"})'>Unshelve</button>`
          : `<button class="small" onclick='post("/api/alarms/shelve",{tag:"${a.tag}",minutes:30})'>Shelve</button>`}
      </td>
    </tr>`).join("");
  $("alarmBody").innerHTML = rows ||
    '<tr><td colspan="7" class="muted">No active alarms.</td></tr>';
}

async function refreshTrend() {
  const seconds = +$("span").value;
  const tags = ["LT101", "LIC101_SP", "LIC101_OP"];
  let d;
  try {
    d = await (await fetch(
      `/api/trend?tags=${tags.join(",")}&seconds=${seconds}&freq=1`)).json();
  } catch (e) { return; }
  const svg = $("trend");
  const W = 900, H = 240, PAD = 34;
  if (!d.t || d.t.length < 2) {
    svg.innerHTML = `<text x="14" y="24" fill="#8b97a4" font-size="12">`
      + `No history yet.</text>`;
    return;
  }
  // Level tags share one axis; the valve output has its own on the right.
  const lvl = ["LT101", "LIC101_SP"], all = [];
  lvl.forEach(t => (d.series[t] || []).forEach(v => v != null && all.push(v)));
  const lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.12 || 10;
  const y0 = lo - pad, y1 = hi + pad;
  const n = d.t.length;
  const X = i => PAD + (W - PAD - 12) * i / (n - 1);
  const Y = v => H - PAD - (H - 2 * PAD) * (v - y0) / (y1 - y0 || 1);
  const YO = v => H - PAD - (H - 2 * PAD) * v / 100;

  let out = "";
  for (let g = 0; g <= 4; g++) {
    const y = PAD + (H - 2 * PAD) * g / 4;
    const val = y1 - (y1 - y0) * g / 4;
    out += `<line x1="${PAD}" y1="${y}" x2="${W - 12}" y2="${y}" `
         + `stroke="#2a323b"/><text x="4" y="${y + 4}" fill="#8b97a4" `
         + `font-size="10">${val.toFixed(0)}</text>`;
  }
  tags.forEach((t, k) => {
    const s = d.series[t] || [];
    const yf = (t === "LIC101_OP") ? YO : Y;
    let path = "", pen = false;
    s.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      path += (pen ? "L" : "M") + X(i).toFixed(1) + " " + yf(v).toFixed(1) + " ";
      pen = true;
    });
    out += `<path d="${path}" fill="none" stroke="${COLORS[k]}" stroke-width="1.6"/>`;
  });
  svg.innerHTML = out;
  $("legend").innerHTML = tags.map((t, k) =>
    `<span style="color:${COLORS[k]}">&#9632;</span> ${t}`).join(" &nbsp; ")
    + ' &nbsp; <span style="color:#8b97a4">(OP on 0-100 right scale)</span>';
}

refresh(); refreshTrend();
setInterval(refresh, 1000);
setInterval(refreshTrend, 5000);
</script>
</body>
</html>

[project]
name = "pyplant"
version = "0.1.0"
description = "A simulated process plant with a soft PLC, Modbus/OPC UA SCADA stack, ISA-18.2 alarms, fault injection and machine-learning fault detection"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammadhossein Modirrousta" }]
# 3.11 is a hard floor, not a preference: pyplant.hmi.alarms uses enum.StrEnum.
requires-python = ">=3.11"
keywords = ["process control", "PLC", "SCADA", "OPC UA", "Modbus",
            "fault detection", "digital twin", "industrial automation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
]

# The runtime stack: physics, PLC, Modbus, OPC UA, historian, HMI. Everything
# needed to start the four services and run a scenario.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pymodbus>=3.8,<3.9",   # 3.9+ replaced the datastore API this project uses
    "asyncua>=1.1",
    "duckdb>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Dataset generation, training and evaluation.
ml = ["scikit-learn>=1.4", "pyarrow>=15", "joblib>=1.3"]
# The workbench GUI. Nothing outside pyplant/workbench imports these.
ui = ["dash>=2.17", "plotly>=5.20"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["pyplant[ml,ui,dev]"]

[project.scripts]
pyplant-workbench = "pyplant.workbench.app:main"
pyplant-train = "pyplant.ml.train:main"

[project.urls]
Repository = "https://github.com/mhmodir/pyplant"
Documentation = "https://github.com/mhmodir/pyplant/blob/main/docs/pdf/pyplant-manual.pdf"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyplant*"]

# The operator page is data, not code, and is loaded by path at runtime.
# Without this, an installed copy serves a FileNotFoundError instead of a mimic.
[tool.setuptools.package-data]
pyplant = ["hmi/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: starts real subprocesses or runs long simulations"]
filterwarnings = ["ignore::DeprecationWarning"]
